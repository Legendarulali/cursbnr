name: BNR Rates Discord Alert

on:
  schedule:
    # Rulează de luni până vineri la ora 13:15 (ora României)
    - cron: '15 10 * * 1-5'
  workflow_dispatch: # Permite rularea manuală din interfața GitHub

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Preia codul din repozitoriu
        uses: actions/checkout@v4

      - name: Configurează mediul Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalează dependențele
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execută scriptul Python
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python cursbnr.py 
